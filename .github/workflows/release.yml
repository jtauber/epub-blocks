name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Run strict type checking
        run: uv run pyright
      - name: Run tests with branch coverage
        run: |
          uv run coverage erase
          uv run coverage run -m unittest discover -s tests
          uv run coverage report
      - name: Verify the public typing surface
        run: uv run pyright --verifytypes epub_blocks --ignoreexternal

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"v{project['project']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match pyproject version "
                  f"({expected!r})"
              )
          PY
      - name: Prepare an empty artifact directory
        run: |
          uv run python - <<'PY'
          import pathlib
          import shutil

          artifacts = pathlib.Path("dist")
          if artifacts.exists():
              shutil.rmtree(artifacts)
          artifacts.mkdir()
          if any(artifacts.iterdir()):
              raise SystemExit("dist/ is not empty")
          PY
      - name: Build distributions
        run: uv run python -m build --outdir dist
      - name: Check distribution metadata
        run: uv run twine check --strict dist/*
      - name: Inspect artifacts
        run: |
          uv run python - <<'PY'
          import pathlib
          import tarfile
          import tomllib
          import zipfile

          dist = pathlib.Path("dist")
          artifacts = sorted(path for path in dist.iterdir() if path.is_file())
          source_archives = [
              path for path in artifacts if path.name.endswith(".tar.gz")
          ]
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          if len(artifacts) != 2 or len(source_archives) != 1 or len(wheels) != 1:
              raise SystemExit(
                  "expected exactly one source archive and one wheel; found "
                  + ", ".join(path.name for path in artifacts)
              )

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          source = source_archives[0]
          wheel = wheels[0]
          expected_source = f"epub_blocks-{version}.tar.gz"
          expected_wheel = f"epub_blocks-{version}-py3-none-any.whl"
          if source.name != expected_source or wheel.name != expected_wheel:
              raise SystemExit(
                  "unexpected artifact names: "
                  f"{source.name!r}, {wheel.name!r}"
              )

          with tarfile.open(source) as archive:
              source_names = archive.getnames()
          for suffix in (
              "/docs/recipe-format.md",
              "/src/epub_blocks/py.typed",
              "/src/epub_blocks/schemas/recipe-v1.schema.json",
          ):
              if not any(name.endswith(suffix) for name in source_names):
                  raise SystemExit(f"source archive is missing {suffix[1:]}")

          with zipfile.ZipFile(wheel) as archive:
              wheel_names = set(archive.namelist())
          for name in (
              "epub_blocks/py.typed",
              "epub_blocks/schemas/recipe-v1.schema.json",
          ):
              if name not in wheel_names:
                  raise SystemExit(f"wheel is missing {name}")
          PY
      - name: Smoke-test the built wheel
        run: |
          uv venv --python 3.13 .release-wheel-venv
          uv pip install --python .release-wheel-venv/bin/python --no-deps dist/*.whl
          .release-wheel-venv/bin/epub-blocks --version
          .release-wheel-venv/bin/python - <<'PY'
          import importlib.metadata
          import importlib.resources
          import json
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = project["project"]["version"]
          actual = importlib.metadata.version("epub-blocks")
          if actual != expected:
              raise SystemExit(
                  f"installed version {actual!r} does not match {expected!r}"
              )
          schema = importlib.resources.files("epub_blocks").joinpath(
              "schemas", "recipe-v1.schema.json"
          )
          json.loads(schema.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-github
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/epub-blocks
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Retries use the same checked artifacts, already frozen on GitHub.
          skip-existing: true

  publish-to-github:
    name: Stage assets and publish immutable GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish the checked distributions
        shell: bash
        run: |
          # No release is published until both distributions have been attached
          # and downloaded again for a byte-for-byte comparison.
          if draft=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            case "$draft" in
              true|false) ;;
              *) echo "Unexpected release state: $draft" >&2; exit 1 ;;
            esac
          else
            # A failed lookup is not proof of absence: create fails safely if
            # the release actually exists or GitHub is unavailable.
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
            draft=true
          fi

          if [ "$draft" = true ]; then
            # Only drafts may replace assets, including on a partial retry.
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

          verification_dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --dir "$verification_dir"
          diff --recursive --brief dist "$verification_dir"

          if [ "$draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
